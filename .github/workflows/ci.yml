name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package tests (Core, Engine, Pipeline)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build and test
        run: swift test --package-path Packages/MediaSlimKit 2>&1 | tee package-test.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-log
          path: package-test.log

  app:
    name: App build, UI tests and accessibility audit
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for runtime in reversed(ios):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and "Pro Max" not in d["name"]:
                      print(d["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MediaSlim.xcodeproj \
            -scheme MediaSlim \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*(Sendable|concurrency)|Test Case|ACCESSIBILITY|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
